name: Refresh Stock Prices

# Runs every 2 hours to update the Supabase cache.
# The mobile app reads from this cache instead of hitting Finnhub directly,
# which keeps the API key off the device and prevents rate-limit exhaustion.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: # lets you trigger a manual run from the GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Refresh stock prices
        working-directory: scripts
        env:
          FINNHUB_API_KEY:           ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node refresh-stocks.js
